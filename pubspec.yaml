name: gulaku
description: Aplikasi pencatatan gula darah offline-first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^11.2.0
  timezone: ^0.10.0
  local_auth: ^2.3.0
  intl: ^0.19.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  material_ui: ^0.0.1
  flutter_timezone: ^5.1.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.26.1
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/backgrounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/icon.png
  adaptive_icon_background: "#0F9D8A"
  adaptive_icon_foreground: assets/app_icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F7FAFA"
  color_dark: "#121C26"
  image: assets/app_icon/splash_logo.png
  image_dark: assets/app_icon/splash_logo.png
  android_12:
    color: "#F7FAFA"
    color_dark: "#121C26"
    image: assets/app_icon/splash_logo.png
    image_dark: assets/app_icon/splash_logo.png
    icon_background_color: "#0F9D8A"
    icon_background_color_dark: "#0F9D8A"

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
